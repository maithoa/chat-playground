---
name: Chat Playground CI Pipeline

"on":
  push: # Trigger CI on all branches
  pull_request: # Trigger CI on all pull requests

jobs:
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Automate pip cache to speed up for next run

      - name: Install Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Backend Pytest suite
        working-directory: backend
        env:
          # Set environtment variables for app to run
          PORT: 8686
        run: |
          python -m pytest -v

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          npm run test:ci
